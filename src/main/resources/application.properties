# --- Active profile ---
# "local" uses Ollama (your laptop). Render will override this to "cloud"
# via an environment variable, which switches to Groq instead - see
# application-cloud.properties.
spring.profiles.active=local

# --- Server ---
# ${PORT:8080} means: use the PORT environment variable if one is set
# (Render sets this automatically), otherwise fall back to 8080 for local runs.
server.port=${PORT:8080}

# --- H2 in-memory database ---
# Data resets every time the app restarts - fine for step 1 (CRUD only).
# When we get to Step 3 (pgvector), we'll swap this block for a real Postgres connection.
spring.datasource.url=jdbc:h2:mem:intakedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --- H2 web console ---
# Lets you browse the in-memory DB in a browser while the app is running.
# Visit: http://localhost:8080/h2-console
# JDBC URL to paste in: jdbc:h2:mem:intakedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Ollama (local LLM) ---
# Only used when the "local" profile is active (see OllamaClassificationService).
ollama.base-url=http://localhost:11434
ollama.model=llama3.2:1b